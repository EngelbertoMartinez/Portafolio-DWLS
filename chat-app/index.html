<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="/socket.io/socket.io.js"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container">

    <br>

    <h1 class="text-center">Chat en Tiempo Real</h1>

    <br>

    <div id="messages"></div>

    <br>

    <input
        id="name"
        class="form-control"
        placeholder="Nombre"
    >

    <br>

    <textarea
        id="message"
        class="form-control"
        placeholder="Mensaje"
    ></textarea>

    <br>

    <button id="send" class="btn btn-primary">
        Enviar
    </button>

</div>

<script>

    const socket = io()

    $(() => {

        // Obtener mensajes
        getMessages()

        // Enviar mensaje
        $("#send").click(() => {

            const message = {
                name: $("#name").val(),
                message: $("#message").val()
            }

            postMessage(message)
        })

        // Escuchar tiempo real
        socket.on('message', addMessages)

    })

    function addMessages(message) {

        $("#messages").append(`
            <h4> ${message.name} </h4>
            <p> ${message.message} </p>
        `)
    }

    function getMessages() {

        $.get('http://localhost:3000/messages', (data) => {

            data.forEach(addMessages)
        })
    }

    function postMessage(message) {

        $.post('http://localhost:3000/messages', message)
    }

</script>

</body>
</html>
